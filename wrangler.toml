# Cloudflare Pages: витрина Noventis (public/) + functions/api — пересылка /api/* на Render.
# Выкладка: npx wrangler pages deploy
# Секрет PROXY_KEY задаётся в панели Cloudflare (Settings → Variables and Secrets), тот же, что на Render.
name = "noventis"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[vars]
BACKEND_URL = "https://noventis.onrender.com"
