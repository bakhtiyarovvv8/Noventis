<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noventis — калькулятор стоимости</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="test-page">
  <div class="test-bg"><img src="/img/london.jpg" alt=""></div>
  <header class="nav scrolled">
    <div class="container">
      <a href="/" class="wordmark">Noventis<span>.</span></a>
      <nav class="nav-links">
        <a href="/tools" data-i18n="nav_tools"></a>
        <a href="/catalog" data-i18n="nav_unis"></a>
        <a href="/start" data-i18n="nav_start"></a>
      </nav>
      <div class="nav-right">
        <div class="lang-toggle"><button data-lang="ru">RU</button><button data-lang="uz">UZ</button><button data-lang="en">EN</button></div>
        <div class="nav-auth"></div>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="page-head">
      <span class="kicker" data-i18n="nav_tools"></span>
      <h1 data-i18n="co_title"></h1>
      <p data-i18n="co_lead"></p>
    </div>

    <article class="card">
      <div class="calc-form">
        <label class="calc-field"><span data-i18n="co_country"></span><select class="select" id="cc"></select></label>
        <label class="calc-field"><span data-i18n="co_type"></span><select class="select" id="type"></select></label>
        <label class="calc-field"><span><span data-i18n="co_years"></span>: <b id="yearsV"></b></span><input type="range" id="years" min="1" max="6" step="1" value="4"></label>
        <label class="calc-field"><span data-i18n="co_style"></span><select class="select" id="style"></select></label>
        <label class="calc-field"><span data-i18n="co_field"></span><select class="select" id="field"></select></label>
      </div>
      <div class="pick-uni" id="uniBox"></div>
    </article>

    <div id="out"></div>
    <p class="source" data-i18n="co_note"></p>
  </main>

  <script src="/vendor/gsap.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/uz.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/abroad.js"></script>
  <script src="/js/unis-data.js"></script>
  <script src="/js/finder.js"></script>
  <script src="/js/cost.js"></script>
</body>
</html>
