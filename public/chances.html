<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noventis — калькулятор шансов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="test-page">
  <div class="test-bg"><img src="/img/graduation.jpg" alt=""></div>
  <header class="nav scrolled">
    <div class="container">
      <a href="/" class="wordmark">Noventis<span>.</span></a>
      <nav class="nav-links">
        <a href="/tools" data-i18n="nav_tools"></a>
        <a href="/catalog" data-i18n="nav_unis"></a>
      </nav>
      <div class="nav-right">
        <div class="lang-toggle"><button data-lang="ru">RU</button><button data-lang="uz">UZ</button><button data-lang="en">EN</button></div>
        <div class="nav-auth"></div>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="page-head">
      <span class="kicker" data-i18n="nav_tools"></span>
      <h1 data-i18n="ch_title"></h1>
      <p data-i18n="ch_lead"></p>
    </div>

    <article class="card">
      <div class="calc-form">
        <label class="calc-field"><span data-i18n="ch_ielts"></span><select class="select" id="ielts"></select></label>
        <label class="calc-field"><span data-i18n="ch_sat"></span><input class="input" id="sat" type="number" min="400" max="1600" step="10" inputmode="numeric" placeholder="1400"></label>
        <label class="calc-field"><span><span data-i18n="ch_gpa"></span>: <b id="gpaV"></b></span><input type="range" id="gpa" min="3" max="5" step="0.1" value="4.5" style="margin-top:22px"></label>
        <label class="calc-field"><span data-i18n="ch_olymp"></span><select class="select" id="olymp"></select></label>
        <label class="calc-field"><span data-i18n="ch_field"></span><select class="select" id="field"></select></label>
      </div>
      <label class="pick" style="margin-top:18px"><input type="checkbox" id="ru"><span data-i18n="ch_ru"></span></label>
      <h4 class="rank" style="margin:22px 0 12px" data-i18n="ch_countries"></h4>
      <div class="chips-pick" id="countries"></div>
    </article>

    <div id="tip"></div>
    <div class="ch-cols" id="out"></div>
    <p class="source" data-i18n="ch_note"></p>
  </main>

  <script src="/vendor/gsap.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/uz.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/abroad.js"></script>
  <script src="/js/unis-data.js"></script>
  <script src="/js/finder.js"></script>
  <script src="/js/chances.js"></script>
</body>
</html>
