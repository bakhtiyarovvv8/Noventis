<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noventis — инструменты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="test-page">
  <div class="test-bg"><img src="/img/tokyo.jpg" alt=""></div>
  <header class="nav scrolled">
    <div class="container">
      <a href="/" class="wordmark">Noventis<span>.</span></a>
      <nav class="nav-links">
        <a href="/tools" data-i18n="nav_tools"></a>
        <a href="/catalog" data-i18n="nav_unis"></a>
      </nav>
      <div class="nav-right">
        <div class="lang-toggle"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
        <div class="nav-auth"></div>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="page-head">
      <span class="kicker">Noventis</span>
      <h1 data-i18n="tools_title"></h1>
      <p data-i18n="tools_lead"></p>
    </div>
    <div class="tools-grid" id="grid"></div>
  </main>

  <script src="/vendor/gsap.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/common.js"></script>
  <script>
    // Список инструментов: ссылка, значок, название и описание
    const TOOLS = [
      { href: '/test?cat=university', g: '▲', n: L('Тест «Университет»', '“University” test'), d: L('Направление и вузы по твоим способностям', 'Fields and universities that match your abilities') },
      { href: '/test?cat=work', g: '◆', n: L('Тест «Работа»', '“Career” test'), d: L('Профессии и зарплаты под твои навыки', 'Careers and salaries for your skills') },
      { href: '/test?cat=prep', g: '✎', n: L('План подготовки', 'Prep plan'), d: L('Экзамены, сроки и неделя подготовки', 'Exams, deadlines and your study week') },
      { href: '/catalog', g: '⌕', n: L('Все вузы мира', 'All universities'), d: L('10 000+ вузов из 200 стран, поиск и ♡', '10,000+ universities in 200 countries, search and ♡') },
      { href: '/profile', g: '⇆', n: L('Сравнение результатов', 'Compare results'), d: L('Как менялись склонности со временем', 'How your interests changed over time') },
      { href: '/profile#favorites', g: '♥', n: L('Избранные вузы', 'Saved universities'), d: L('Твой список вузов в кабинете', 'Your university shortlist in the dashboard') },
    ];
    const render = () => {
      document.getElementById('grid').innerHTML = TOOLS.map(x =>
        `<a class="tool" href="${x.href}"><div class="glyph">${x.g}</div><b>${tx(x.n)}</b><span>${tx(x.d)}</span></a>`).join('');
    };
    document.addEventListener('langchange', render);
    document.addEventListener('DOMContentLoaded', () => {
      loadMe(); render();
      gsap.from('.page-head > *, .tool', { y: 30, opacity: 0, stagger: .05, duration: 1, ease: 'expo.out' });
    });
  </script>
</body>
</html>
