<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noventis — инструменты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="test-page">
  <div class="test-bg"><img src="/img/tokyo.jpg" alt=""></div>
  <header class="nav scrolled">
    <div class="container">
      <a href="/" class="wordmark">Noventis<span>.</span></a>
      <nav class="nav-links">
        <a href="/tools" data-i18n="nav_tools"></a>
        <a href="/catalog" data-i18n="nav_unis"></a>
      </nav>
      <div class="nav-right">
        <div class="lang-toggle"><button data-lang="ru">RU</button><button data-lang="uz">UZ</button><button data-lang="en">EN</button></div>
        <div class="nav-auth"></div>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="page-head">
      <span class="kicker">Noventis</span>
      <h1 data-i18n="tools_title"></h1>
      <p data-i18n="tools_lead"></p>
    </div>
    <div class="tools-grid" id="grid"></div>
  </main>

  <script src="/vendor/gsap.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/uz.js"></script>
  <script src="/js/common.js"></script>
  <script>
    // Список инструментов: ссылка, значок, название и описание
    const TOOLS = [
      { href: '/careers', g: '☀', n: L('Профессии', 'Careers'), d: L('День из жизни, зарплаты и сравнение двух профессий', 'A day in the life, salaries and side-by-side comparison') },
      { href: '/chances', g: '◎', n: L('Калькулятор шансов', 'Admission chances'), d: L('По баллам и направлению: куда с запасом, куда реально, а куда мечта', 'By scores and field: safe, realistic and dream universities') },
      { href: '/cost', g: '$', n: L('Калькулятор стоимости', 'Cost calculator'), d: L('Учёба и жизнь в стране или конкретном вузе, $ и сумы + гранты', 'Study and living costs in a country or a specific university, $ and UZS + grants') },
      { href: '/resources', g: '❖', n: L('Бесплатные ресурсы', 'Free resources'), d: L('Курсы и сайты по экзаменам и сферам', 'Courses and sites by exam and field') },
      { href: '/plan', g: '☑', n: L('План по неделям', 'Weekly plan'), d: L('Вуз, направление и дедлайн → план, который можно править', 'University, field and deadline → a plan you can edit') },
      { href: '/deadlines', g: '⏰', n: L('Календарь дедлайнов', 'Deadline calendar'), d: L('Только твои даты: из плана и свои события', 'Only your dates: from your plan and your own events') },
      { href: '/favorites', g: '♥', n: L('Избранные вузы', 'Saved universities'), d: L('Твои ♡ и подбор вузов по стране, бюджету и направлению', 'Your ♡ and a university finder by country, budget and field') },
    ];
    const render = () => {
      document.getElementById('grid').innerHTML = TOOLS.map(x =>
        `<a class="tool" href="${x.href}"><div class="glyph">${x.g}</div><b>${tx(x.n)}</b><span>${tx(x.d)}</span></a>`).join('');
    };
    document.addEventListener('langchange', render);
    document.addEventListener('DOMContentLoaded', () => {
      loadMe(); render();
      gsap.from('.page-head > *, .tool', { y: 30, opacity: 0, stagger: .05, duration: 1, ease: 'expo.out' });
    });
  </script>
</body>
</html>
