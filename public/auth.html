<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noventis — вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth">
    <div class="auth-visual">
      <img src="/img/clouds.jpg" alt="">
      <a href="/" class="wordmark">Noventis<span>.</span></a>
      <div class="quote" data-i18n="auth_quote"></div>
    </div>

    <div class="auth-side">
      <div class="top">
        <a href="/" class="wordmark" style="font-size:18px">Noventis<span>.</span></a>
        <div class="lang-toggle"><button data-lang="ru">RU</button><button data-lang="uz">UZ</button><button data-lang="en">EN</button></div>
      </div>

      <div class="auth-card">
        <h1 id="auth-title"></h1>
        <p class="lead" id="auth-lead"></p>

        <div class="tabs" id="tabs" data-mode="login">
          <span class="pill"></span>
          <button type="button" data-mode="login" class="on" data-i18n="tab_login"></button>
          <button type="button" data-mode="register" data-i18n="tab_register"></button>
        </div>

        <form id="auth-form" novalidate>
          <div class="field" data-only="register">
            <input id="name" name="name" type="text" placeholder=" " autocomplete="name" maxlength="60">
            <label for="name" data-i18n="f_name"></label>
          </div>
          <div class="field">
            <input id="email" name="email" type="email" placeholder=" " autocomplete="email" required>
            <label for="email" data-i18n="f_email"></label>
          </div>
          <div class="field has-eye">
            <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
            <label for="password" data-i18n="f_password"></label>
            <button type="button" class="eye" id="eye" aria-label="show password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength" data-only="register"><i></i><i></i><i></i><span id="strength-label" data-i18n="f_password_hint"></span></div>
          <div class="form-error" id="form-error"></div>
          <button class="btn btn-gold" type="submit" id="submit"></button>
          <p class="form-wait" id="form-wait" data-i18n="wait_wake" hidden></p>
        </form>
      </div>
    </div>
  </main>

  <script src="/vendor/gsap.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/uz.js"></script>
  <script src="/js/common.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    // возврат только на свой сайт: «//evil.com» и «/\evil.com» браузер понял бы как чужой адрес
    const asked = params.get('next') || '/';
    const next = /^\/(?![\/\\])/.test(asked) ? asked : '/';
    let mode = params.get('mode') === 'register' ? 'register' : 'login';
    const form = document.getElementById('auth-form');
    const errEl = document.getElementById('form-error');
    const pw = document.getElementById('password');

    function setMode(m) {
      mode = m;
      document.getElementById('tabs').dataset.mode = m;
      document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
      document.querySelectorAll('[data-only]').forEach(el => el.classList.toggle('hidden', el.dataset.only !== m));
      pw.autocomplete = m === 'login' ? 'current-password' : 'new-password';
      errEl.textContent = '';
      renderTexts();
      gsap.fromTo('.auth-card form .field, .auth-card .strength:not(.hidden)', { opacity: 0, x: 16 }, { opacity: 1, x: 0, stagger: .05, duration: .6, ease: 'expo.out' });
    }
    function renderTexts() {
      document.getElementById('auth-title').textContent = t(mode === 'login' ? 'auth_welcome' : 'auth_join');
      document.getElementById('auth-lead').textContent = t(mode === 'login' ? 'auth_login_sub' : 'auth_reg_sub');
      document.getElementById('submit').textContent = t(mode === 'login' ? 'btn_login' : 'btn_register');
      updateStrength();
    }
    function updateStrength() {
      const v = pw.value;
      let s = 0;
      if (v.length >= 8) s++;
      if (/[A-ZА-Я]/.test(v) && /[a-zа-я]/.test(v) || /\d/.test(v) && v.length >= 10) s++;
      if (/[^\wА-Яа-я]/.test(v) && v.length >= 10) s++;
      const colors = ['var(--danger)', 'var(--gold)', 'var(--ok)'];
      document.querySelectorAll('.strength i').forEach((i, k) => i.style.background = k < s ? colors[s - 1] : '');
      document.getElementById('strength-label').textContent = !v ? t('f_password_hint') : [t('pw_weak'), t('pw_weak'), t('pw_ok'), t('pw_strong')][s];
    }

    document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
    document.getElementById('eye').addEventListener('click', () => { pw.type = pw.type === 'password' ? 'text' : 'password'; });
    pw.addEventListener('input', updateStrength);
    document.addEventListener('langchange', renderTexts);

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errEl.textContent = '';
      const body = { email: form.email.value.trim(), password: pw.value };
      if (mode === 'register') body.name = document.getElementById('name').value.trim();
      // клиентская проверка (сервер проверяет то же самое)
      if (mode === 'register' && body.name.length < 2) return errEl.textContent = t('err_name_short');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(body.email)) return errEl.textContent = t('err_email_invalid');
      if (mode === 'register' && body.password.length < 8) return errEl.textContent = t('err_password_short');

      const btn = document.getElementById('submit');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      // Сервер на бесплатном тарифе засыпает — если ответа нет 3 секунды, объясняем, что он просыпается
      const waitEl = document.getElementById('form-wait');
      const waitTimer = setTimeout(() => { waitEl.hidden = false; }, 3000);
      try {
        const r = await api(mode === 'login' ? '/api/login' : '/api/register', { method: 'POST', body });
        if (r.ok) { location.href = next; return; }
        errEl.textContent = t('err_' + r.data.error) !== 'err_' + r.data.error ? t('err_' + r.data.error) : t('err_server');
        gsap.fromTo('.auth-card', { x: -8 }, { x: 0, duration: .5, ease: 'elastic.out(1, .3)' });
      } catch { errEl.textContent = t('err_server'); }
      clearTimeout(waitTimer); waitEl.hidden = true;
      btn.disabled = false; renderTexts();
    });

    document.addEventListener('DOMContentLoaded', async () => {
      if (await loadMe()) { location.href = next; return; }
      setMode(mode);
      gsap.from('.auth-card > *', { y: 30, opacity: 0, stagger: .08, duration: 1, ease: 'expo.out' });
      gsap.from('.auth-visual .quote', { y: 40, opacity: 0, duration: 1.4, delay: .3, ease: 'expo.out' });
    });
  </script>
</body>
</html>
