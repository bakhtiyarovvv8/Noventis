<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noventis — вузы мира</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="test-page">
  <div class="test-bg"><img src="/img/campus.jpg" alt=""></div>
  <header class="nav scrolled">
    <div class="container">
      <a href="/" class="wordmark">Noventis<span>.</span></a>
      <nav class="nav-links">
        <a href="/tools" data-i18n="nav_tools"></a>
        <a href="/catalog" data-i18n="nav_unis"></a>
        <a href="/start" data-i18n="nav_start"></a>
      </nav>
      <div class="nav-right">
        <div class="lang-toggle"><button data-lang="ru">RU</button><button data-lang="uz">UZ</button><button data-lang="en">EN</button></div>
        <div class="nav-auth"></div>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="page-head">
      <span class="kicker" data-i18n="nav_tools"></span>
      <h1 data-i18n="cat_title"></h1>
      <p data-i18n="cat_lead"></p>
    </div>
    <div class="filters">
      <input class="input" id="q" type="search" autocomplete="off" data-i18n-ph="cat_search">
    </div>
    <div id="finder"></div>
    <h2 class="cat-all-head" data-i18n="cat_all_title"></h2>
    <p class="count" id="count"></p>
    <div class="uni-list" id="list"></div>
    <div class="more-row"><button class="btn btn-ghost hidden" id="more" data-i18n="cat_more"></button></div>
    <p class="source" data-i18n="cat_source"></p>
  </main>

  <script src="/vendor/gsap.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/uz.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/abroad.js"></script>
  <script src="/js/unis-data.js"></script>
  <script src="/js/finder.js"></script>
  <script src="/js/catalog.js"></script>
</body>
</html>
